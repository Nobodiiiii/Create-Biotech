        <option value="armA">胳膊 A</option><option value="armB">胳膊 B</option><option value="body">身体</option>

    let x=Math.max(0,Math.min(width-w,(p.x+1)*width/2+9));
    let y=Math.max(0,Math.min(height-h-18,(-p.y+1)*height/2-h-5));
    for(let attempt=0;attempt<6;attempt++) {
      const overlap=placed.some(b=>x<b.x+b.w+4&&x+w+4>b.x&&y<b.y+b.h+3&&y+h+3>b.y);
      if(!overlap)break;
      y=y+h+4<height-h-18?y+h+4:Math.max(0,y-h-4);
    }
    item.el.style.left=x+'px';item.el.style.top=y+'px';placed.push({x,y,w,h});
  }
}
function render() {
  for(const side of ['A','B'])overlays[side].ring.quaternion.copy(camera.quaternion);
  renderer.render(scene,camera);layoutLabels();
}
function resize() {
  const width=stage.clientWidth,height=stage.clientHeight;
  if(!width||!height)return;
  renderer.setSize(width,height,false);camera.aspect=width/height;camera.updateProjectionMatrix();render();
}
function resolveColor(variable) {
  const probe=document.createElement('span');probe.style.color='var('+variable+')';root.append(probe);
  const color=getComputedStyle(probe).color;probe.remove();
  const canvas=document.createElement('canvas');canvas.width=canvas.height=1;
  const context=canvas.getContext('2d',{willReadFrequently:true});context.fillStyle=color;context.fillRect(0,0,1,1);
  const rgb=context.getImageData(0,0,1,1).data;
  return new THREE.Color().setRGB(rgb[0]/255,rgb[1]/255,rgb[2]/255,THREE.SRGBColorSpace);
}
function theme() {
  const neutral=resolveColor('--muted-foreground');
  const series={A:resolveColor('--viz-series-1'),B:resolveColor('--viz-series-2')};
  meshes.body.material.color.copy(neutral);meshes.body.children[0].material.color.copy(neutral);
  for(const side of ['A','B']) {
    const c=series[side],overlay=overlays[side];
    meshes['arm'+side].material.color.copy(c);meshes['arm'+side].children[0].material.color.copy(c);
    meshes['elbow'+side].material.color.copy(c);overlay.shoulder.material.color.copy(c);overlay.ring.material.color.copy(c);
    overlay.axisLine.material.color.copy(neutral);overlay.candidates.forEach(m=>m.material.color.copy(neutral));
  }
  grid.material.color.copy(neutral);bodyBounds.material.color.copy(neutral);axes.forEach(a=>a.setColor(neutral));render();
}
function snapshot() {
  const objects={};
  for(const [name,mesh]of Object.entries(meshes)) objects[name]={p:mesh.position.toArray(),r:[mesh.rotation.x,mesh.rotation.y,mesh.rotation.z].map(THREE.MathUtils.radToDeg),s:mesh.scale.toArray()};
  return {version:2,selected,mode,elbows:{...elbows},objects,camera:camera.position.toArray(),target:orbit.target.toArray()};
}
function scheduleSave() {
  clearTimeout(saveTimer);saveTimer=setTimeout(()=>{
    const state=snapshot();
    const modelContent={selected,mode,arms:Object.fromEntries(['A','B'].map(s=>[s,{...state.objects['arm'+s],elbow:elbows[s]?state.objects['elbow'+s].p:null,shoulder:modelCoordinate(results[s].pivot),branch:results[s].branch}])),body:state.objects.body};
    window.openai?.setWidgetState?.({modelContent,privateContent:state})?.catch(()=>{});
  },220);
}
function applyState(saved) {
  const source=saved&&[1,2].includes(saved.version)?saved:defaults;
  for(const [name,mesh] of Object.entries(meshes)) {
    const item=source.objects?.[name]||defaults.objects[name];
    const valid=(value,fallback,positive=false)=>Array.isArray(value)&&value.length===3&&value.every(v=>Number.isFinite(v)&&(!positive||v>=.1))?value:fallback;
    mesh.position.fromArray(valid(item.p,defaults.objects[name].p));
    const rotation=valid(item.r,defaults.objects[name].r);mesh.rotation.set(...rotation.map(THREE.MathUtils.degToRad));
    mesh.scale.fromArray(valid(item.s,defaults.objects[name].s,true));
  }
  elbows={A:!!source.elbows?.A,B:!!source.elbows?.B};
  for(const side of ['A','B']) {$('[data-elbow="'+side+'"]').checked=elbows[side];$('[data-object] option[value="elbow'+side+'"]').disabled=!elbows[side];}
  let choice=source.selected in meshes?source.selected:'armA';
  if(choice.startsWith('elbow')&&!elbows[choice.slice(-1)])choice='arm'+choice.slice(-1);
  setMode(source.version===1?'rotate':['translate','rotate','scale'].includes(source.mode)?source.mode:'rotate');
  if(Array.isArray(source.camera)&&source.camera.length===3&&source.camera.every(Number.isFinite))camera.position.fromArray(source.camera);
  if(Array.isArray(source.target)&&source.target.length===3&&source.target.every(Number.isFinite))orbit.target.fromArray(source.target);
  orbit.update();selectObject(choice);
}
$('[data-object]').addEventListener('change',e=>{selectObject(e.target.value);scheduleSave();});
for(const button of root.querySelectorAll('[data-mode]'))button.addEventListener('click',()=>{setMode(button.dataset.mode);render();scheduleSave();});
for(const side of ['A','B'])$('[data-elbow="'+side+'"]').addEventListener('change',e=>{
  elbows[side]=e.target.checked;
  $('[data-object] option[value="elbow'+side+'"]').disabled=!elbows[side];
  if(elbows[side]) {
    // Initialize only when enabled; once supplied the elbow is an independent input.
    meshes['arm'+side].updateMatrix();const local=new THREE.Vector3(0,.5,0).applyMatrix4(meshes['arm'+side].matrix);meshes['elbow'+side].position.copy(local);
    selectObject('elbow'+side);
  } else if(selected==='elbow'+side)selectObject('arm'+side);
  update();scheduleSave();
});
transform.addEventListener('dragging-changed',e=>{orbit.enabled=!e.value;if(!e.value)scheduleSave();});
transform.addEventListener('change',render);
transform.addEventListener('objectChange',()=>{
  const mesh=meshes[selected];
  mesh.scale.set(Math.max(.1,mesh.scale.x),Math.max(.1,mesh.scale.y),Math.max(.1,mesh.scale.z));
  update();scheduleSave();
});
orbit.addEventListener('change',render);orbit.addEventListener('end',scheduleSave);
let pointerStart=null;
renderer.domElement.addEventListener('pointerdown',e=>{pointerStart={x:e.clientX,y:e.clientY,wasGizmo:!!transform.axis};});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!pointerStart||pointerStart.wasGizmo||Math.hypot(e.clientX-pointerStart.x,e.clientY-pointerStart.y)>4)return;
  const rect=renderer.domElement.getBoundingClientRect(),pointer=new THREE.Vector2((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);
  const ray=new THREE.Raycaster();ray.setFromCamera(pointer,camera);
  const pickable=Object.values(meshes).filter(m=>m.visible);const hit=ray.intersectObjects(pickable,false)[0];
  if(hit){selectObject(Object.keys(meshes).find(name=>meshes[name]===hit.object));scheduleSave();}
});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)applyState(e.detail.globals.widgetState.privateContent);});
const resizeObserver=new ResizeObserver(resize);resizeObserver.observe(stage);
const themeObserver=new MutationObserver(theme);
themeObserver.observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
if(document.body)themeObserver.observe(document.body,{attributes:true,attributeFilter:['class','style','data-theme']});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
applyState(window.openai?.widgetState?.privateContent);theme();resize();
status.hidden=true;root.dataset.ready='true';
</script>
