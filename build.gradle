plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

base {
    archivesName = "${mod_id}-${minecraft_version}"
    group = mod_group_id
    version = mod_version
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_version
    }

    mods {
        create_biotech {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.create_biotech
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'mixin.debug.verbose', 'true'
            gameDirectory = project.file('run')
        }

        client {
            client()
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll(
                    '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
            )
        }

        gameTestServer {
            type = 'gameTestServer'
        }
    }
}

repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven' }
    maven { url = 'https://maven.ryanhcode.dev/releases/' }
    mavenCentral()
}

configurations {
    quickPlayMods
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        transitive = false
    }
    implementation("dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${sable_companion_version}")
    jarJar("dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${sable_companion_version}") {
        version {
            strictly sable_companion_version_range
            prefer sable_companion_version
        }
        transitive = false
    }
    compileOnly(sable_compile_coordinate) {
        transitive = false
    }

    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.vanillin:vanillin-neoforge-${minecraft_version}:${vanillin_version}")
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")

    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    compileOnly("maven.modrinth:jade:${jade_version}")

    compileOnly("io.github.llamalad7:mixinextras-common:${mixinextras_version}")
    annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}")

    quickPlayMods("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        transitive = false
    }
    quickPlayMods("dev.engine-room.vanillin:vanillin-neoforge-${minecraft_version}:${vanillin_version}") {
        transitive = false
    }
    quickPlayMods("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") {
        transitive = false
    }
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

sourceSets.test.resources.srcDir 'tools/test-resources'

test {
    useJUnitPlatform()
    systemProperty 'castedMaterials.projectDir', projectDir.toString()
}

def verifyMaterialRenderingModule = tasks.register('verifyMaterialRenderingModule') {
    group = 'verification'
    description = 'Verifies the native Biotech material module, legacy data resources, MIT notice, and unchanged Sable embedding.'
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    doLast {
        new java.util.zip.ZipFile(tasks.named('jar').get().archiveFile.get().asFile).withCloseable { zip ->
            def entries = zip.entries().collect { it.name }
            def modulePath = 'com/nobodiiiii/createbiotech/foundation/render/material/'
            def previousModulePath = 'com/nobodiiiii/createbiotech/foundation/' + 'material/'
            if (entries.any { it.startsWith(previousModulePath) && it.endsWith('.class') }) {
                throw new GradleException('Material classes must belong to foundation.render.material, not the old sibling package')
            }
            ['MaterialRenderingModule.class', 'CastedMaterialsApi.class', 'CastedMaterialState.class',
             'palette/MaterialDiscovery.class', 'palette/MaterialPaletteSync.class',
             'mapping/DefinitionParser.class', 'mapping/UvPlanCompiler.class', 'mapping/UvMapping.class',
             'client/CastedResources.class', 'client/MaterialTextures.class'].each { name ->
                if (zip.getEntry(modulePath + name) == null) {
                    throw new GradleException("Missing native material module class: ${name}")
                }
            }
            def materialClasses = entries.findAll { it.startsWith(modulePath) && it.endsWith('.class') }
            if (materialClasses.any { name ->
                def relative = name.substring(modulePath.length())
                def folder = relative.contains('/') ? relative.substring(0, relative.lastIndexOf('/')) : ''
                !(folder in ['', 'palette', 'mapping', 'client'])
            }) {
                throw new GradleException('Material classes must use root/palette/mapping/flat client packages only')
            }
            ['mapping/MappingComposer.class', 'mapping/CompositionResult.class', 'mapping/SourceSlotImage.class',
             'mapping/PixelReference.class', 'client/ClientRuntime.class', 'client/DefaultClientRuntime.class',
             'client/definition/ResolvedSources.class', 'client/render/CastedTextureHandle.class',
             'client/render/UvTransform.class', 'client/render/UvTransformingVertexConsumer.class',
             'definition/RenderPolicy$Mode.class', 'definition/MaterialRenderSettings$Backend.class',
             'client/uv/UvPlanCompiler$Affine.class', 'CastedIds.class',
             'mapping/RenderPolicy$Mode.class', 'mapping/MaterialRenderSettings$Backend.class',
             'mapping/UvPlanCompiler$Affine.class'].each { name ->
                if (zip.getEntry(modulePath + name) != null) {
                    throw new GradleException("Retired material implementation must not be packaged: ${name}")
                }
            }
            if (entries.any { it.startsWith('com/fluorineuck/') && it.endsWith('.class') }) {
                throw new GradleException('Biotech must not contain classes from the former standalone library package')
            }
            def metadataEntry = zip.getEntry('META-INF/jarjar/metadata.json')
            if (metadataEntry == null) throw new GradleException('Missing JarJar metadata for Sable companion')
            def metadata = zip.getInputStream(metadataEntry).withCloseable {
                new groovy.json.JsonSlurper().parse(it)
            }
            if (metadata.jars.any { it.identifier.group == 'com.fluorineuck'
                    || it.identifier.artifact.startsWith('casted-materials') }
                    || entries.any { it.startsWith('META-INF/jarjar/casted-materials') }) {
                throw new GradleException('The native module must not embed a standalone Casted Materials JAR')
            }
            def sable = metadata.jars.find { it.identifier.group == 'dev.ryanhcode.sable-companion' }
            if (sable == null || zip.getEntry(sable.path) == null
                    || sable.identifier.artifact != 'sable-companion-common-1.21.1'
                    || sable.version.artifactVersion != sable_companion_version
                    || sable.version.range != sable_companion_version_range) {
                throw new GradleException('Sable companion embedding and version range must remain unchanged')
            }
            def descriptor = zip.getInputStream(zip.getEntry('META-INF/neoforge.mods.toml')).withCloseable {
                it.getText('UTF-8')
            }
            if (descriptor =~ /(?m)^\s*modId\s*=\s*["']casted_materials["']/) {
                throw new GradleException('The native module must not declare or require a casted_materials mod')
            }
            if (!(descriptor =~ /(?m)^\s*modId\s*=\s*["']create_biotech["']/)) {
                throw new GradleException('Missing Biotech mod ownership')
            }
            ['assets/create_biotech/casted_materials/targets/spider_assembly_table/spider.json',
             'META-INF/licenses/casted-materials-MIT.txt', 'THIRD_PARTY_NOTICES.md',
             "${mod_name}_LICENSE.md"].each { name ->
                if (zip.getEntry(name) == null) throw new GradleException("Missing module resource or license: ${name}")
            }
            println 'Verified native Biotech material module; no external Casted Materials mod; Sable embedding retained.'
        }
    }
}
// Compatibility aliases for existing local verification commands, not packaging modes.
tasks.register('verifyCastedMaterialsPackaging') { dependsOn verifyMaterialRenderingModule }
tasks.register('verifyCastedMaterialsJarJar') { dependsOn verifyMaterialRenderingModule }
tasks.named('check') { dependsOn verifyMaterialRenderingModule }

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_license            : mod_license,
            mod_description        : mod_description,
            create_version_range   : create_version_range,
            sable_version_range    : sable_version_range,
            jei_version_range      : jei_version_range,
            jade_version           : jade_version
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}

tasks.register('syncQuickPlayMods', Sync) {
    group = 'mod development'
    description = 'Stages the standalone runtime mod dependencies used by quickPlayClient.'
    from(configurations.quickPlayMods)
    into(layout.buildDirectory.dir('quickplay/mods'))
}

def configureQuickPlayClientTask = { Exec task, boolean onlineBuild, boolean smokeRun ->
    task.group = 'mod development'
    if (smokeRun) {
        task.description = 'Runs test.py with an offline Gradle build, quickplays the local NeoForge client, checks world entry, and cleans up.'
    } else {
        task.description = onlineBuild
                ? 'Runs test.py with an online Gradle build, copies the mod jar, and quickplays the local NeoForge client.'
                : 'Runs test.py with an offline Gradle build, copies the mod jar, and quickplays the local NeoForge client.'
    }
    task.workingDir = projectDir

    def command = [project.findProperty('pythonExecutable') ?: 'python', 'test.py']
    if (onlineBuild) {
        command += ['--online-build']
    }
    if (project.hasProperty('instance')) {
        command += ['--instance', project.property('instance').toString()]
    }
    if (project.hasProperty('world')) {
        command += ['--world', project.property('world').toString()]
    }
    if (project.hasProperty('skipBuild')) {
        command += ['--skip-build']
    }
    if (project.hasProperty('noCopy')) {
        command += ['--no-copy']
    }
    if (project.hasProperty('dryRun')) {
        command += ['--dry-run']
    }
    if (smokeRun) {
        command += ['--smoke']
    }
    if (smokeRun && project.hasProperty('smokeTimeout')) {
        command += ['--smoke-timeout', project.property('smokeTimeout').toString()]
    }
    if (smokeRun && project.hasProperty('smokeLogLines')) {
        command += ['--smoke-log-lines', project.property('smokeLogLines').toString()]
    }
    if (project.hasProperty('width')) {
        command += ['--width', project.property('width').toString()]
    }
    if (project.hasProperty('height')) {
        command += ['--height', project.property('height').toString()]
    }

    task.commandLine command
}

tasks.register('quickPlayClient', Exec) {
    configureQuickPlayClientTask(delegate, false, false)
}

tasks.register('quickPlayClientOnline', Exec) {
    configureQuickPlayClientTask(delegate, true, false)
}

tasks.register('quickPlaySmoke', Exec) {
    configureQuickPlayClientTask(delegate, false, true)
}

jar {
    manifest {
        attributes([
                'Specification-Title'       : mod_id,
                'Specification-Vendor'      : mod_authors,
                'Specification-Version'     : '1',
                'Implementation-Title'      : project.name,
                'Implementation-Version'    : project.jar.archiveVersion,
                'Implementation-Vendor'     : mod_authors,
                'Implementation-Timestamp'  : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    from('LICENSE.md') {
        rename { "${mod_name}_${it}" }
    }
    from('THIRD_PARTY_NOTICES.md')
}
